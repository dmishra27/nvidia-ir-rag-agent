# Render.com Blueprint — nvidia-ir-rag-agent FastAPI service
# (api/main.py: /search, /ask, /health). Deploy: connect this repo in the
# Render dashboard as a Blueprint, which reads this file from the repo
# root; Render builds the root Dockerfile and runs its CMD (uvicorn).
#
# Known limitation (see docs/daily_progress/day_12_storyline.md): this
# config gets the *service* deployed and healthy, not the full retrieval
# stack live. BM25Index.load() and DenseIndex.connect() both need real
# data this repo doesn't ship: data/indexes/bm25_index.pkl is gitignored
# (see .gitignore's trailing "data/") and a populated Qdrant collection.
# QDRANT_CLOUD_URL/QDRANT_CLOUD_API_KEY exist in .env for exactly this
# reason but nothing has pointed the deployed service at them yet, and no
# managed Postgres has been provisioned to replace docker-compose.yml's
# local `postgres` service. /health will report "ok"; /search and /ask
# will fail until that data-wiring step happens.
services:
  - type: web
    name: nvidia-ir-rag-agent-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    branch: main
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Secrets -- set once in the Render dashboard (sync: false means
      # Render won't overwrite a value already set there, and this file
      # never carries the actual key).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: POSTGRES_URL
        sync: false
      - key: QDRANT_CLOUD_URL
        sync: false
      - key: QDRANT_CLOUD_API_KEY
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: LANGCHAIN_TRACING_V2
        value: "true"
      - key: LANGCHAIN_PROJECT
        value: nvidia-ir-rag-agent-prod
      # Non-secret config.
      - key: RERANKER_MODE
        value: live_fast
      - key: PYTHONUNBUFFERED
        value: "1"
