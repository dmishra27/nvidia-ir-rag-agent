services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: nvidia_ir
      POSTGRES_PASSWORD: nvidia_ir_pass
      POSTGRES_DB: nvidia_ir_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nvidia_ir']
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    platform: linux/amd64
    restart: "no"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@nvidia-ir.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - '6333:6333'
      - '6334:6334'
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ['CMD-SHELL', 'bash -c "echo > /dev/tcp/127.0.0.1/6333"']
      interval: 5s
      timeout: 5s
      retries: 5

  airflow:
    image: apache/airflow:3.0.2
    restart: unless-stopped
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth'
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_data:/opt/airflow
    ports:
      - '8080:8080'

  jaeger:
    image: jaegertracing/all-in-one:1.60
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
    ports:
      - '16686:16686' # UI
      - '4317:4317' # OTLP gRPC (api/telemetry.py's DEFAULT_OTLP_ENDPOINT)
      - '4318:4318' # OTLP HTTP
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:16686/ || exit 1']
      interval: 5s
      timeout: 5s
      retries: 5

  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    environment:
      PHOENIX_PROJECT_NAME: nvidia-ir-rag-agent
    volumes:
      - phoenix_data:/mnt/data
    ports:
      - '6006:6006' # UI + OTLP/HTTP trace receiver at /v1/traces (monitoring/phoenix_config.py's DEFAULT_PHOENIX_ENDPOINT)
    # Not mapping Phoenix's gRPC OTLP port (4317) — the jaeger service above
    # already owns host port 4317; phoenix_config.py uses the http/protobuf
    # protocol against 6006 instead, so no conflict.
    healthcheck:
      # arizephoenix/phoenix is a Python image without wget/curl guaranteed —
      # use the interpreter itself, mirroring how the app serves its own UI.
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:6006/")']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  qdrant_data:
  airflow_data:
  phoenix_data:
